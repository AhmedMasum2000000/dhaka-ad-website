<!doctype html><html><head><meta charset="utf-8"><title>Traffic jam: what you see vs what a brand sees</title><link rel="stylesheet" href="../slides.css">
<style>
.panel{position:absolute;left:0;right:0;height:540px;background-size:cover;background-position:center}
.panel::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,14,0) 45%,rgba(10,12,14,.85) 100%)}
.lab{position:absolute;left:60px;top:34px;z-index:3;background:var(--bg);color:var(--ink);font-weight:600;font-size:28px;letter-spacing:.18em;padding:12px 20px}
.lab.r{background:var(--red);color:#fff}
.say{position:absolute;left:60px;right:60px;bottom:34px;z-index:3;font-family:Syne;font-weight:800;font-size:56px;line-height:1.08;letter-spacing:-.02em}
.say i{font-style:normal;font-family:'Noto Color Emoji'}
.frame{position:absolute;left:428px;top:50px;width:226px;height:262px;border:8px solid var(--red);border-radius:10px;z-index:2;box-shadow:0 0 0 6000px rgba(10,12,14,.35)}
.foot{position:absolute;left:60px;right:60px;bottom:30px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:30px;z-index:4}
.foot b{font-family:Syne;font-weight:800;font-size:34px}
.foot span{white-space:nowrap;font-family:Syne;font-weight:800;font-size:34px;color:var(--red)}
</style></head><body>
<section class="slide">
  <div class="top" style="left:60px;right:60px;top:40px"><div class="mark">DHAKA AD<span>.</span></div><div class="count">DHAKA TRAFFIC</div></div>
  <div class="panel" style="top:120px;background-image:url('panel-you.jpg')"><div class="lab">WHAT YOU SEE</div><div class="say">Another traffic jam. <i>😩</i></div></div>
  <div class="panel" style="top:672px;overflow:hidden;background-image:url('panel-brand.jpg')"><div class="frame"></div><div class="lab r">WHAT A BRAND SEES</div><div class="say">Customers who can't scroll past. <i>😎</i></div></div>
  <div class="foot"><b>Put your brand where Dhaka waits<span class="red">.</span></b><span>01840 860 284</span></div>
  <div class="bar" style="width:1080px"></div>
</section>
</body></html>
