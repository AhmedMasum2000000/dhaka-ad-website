# Publishes the dhakaad.com build to the `dhakaad-live` branch on every push to main.
# Hostinger (hPanel → Websites → Advanced → Git) auto-deploys that branch to public_html.
name: Publish dhakaad.com build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dhakaad-live
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python scripts/build/export_domain.py _site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dhakaad-live
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: true
          commit_message: "Publish dhakaad.com build"
